[project]
name = "perplexity-to-openai"
version = "0.1.0"
description = "Perplexity to OpenAI-compatible API (Chat Completions + Responses)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "curl_cffi>=0.9",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "ty>=0.0.78",
]

[tool.uv]
package = false
[tool.ruff]
# https://docs.astral.sh/ruff/settings/#preview — preview=true enables all
# unstable rules/fixes/formatting so `--select ALL` truly means everything.
preview = true
target-version = "py312"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/ — ALL enables every stable + preview rule.
select = ["ALL"]
preview = true
# D203 vs D211 and D212 vs D213 are mutually incompatible pairs; ruff itself
# ignores D203/D213 when both are selected (see `ruff check` warnings). List
# them explicitly so the effective set is unchanged but warning-free.
ignore = ["incorrect-blank-line-before-class", "multi-line-summary-second-line"]

[tool.ruff.format]
preview = true


[tool.ty.rules]
# ty docs (Rules): `all = "error"` enables every rule as an error.
all = "error"

[tool.ty.analysis]
# ty docs (reference/configuration#analysis): strictest soundness options.
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.terminal]
# ty docs (reference/configuration#terminal): fail even on warnings.
error-on-warning = true
output-format = "concise"
